<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARTIME Stock</title>
  <meta name="theme-color" content="#f3f5f9">
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("artime.theme"))||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <meta name="description" content="Stock in, stock out and low-stock alerts, synced to Google Sheets.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ARTIME Stock">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="splash"><div class="bigclk"><i></i></div><b>ARTIME</b><small>Loading…</small></div></div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="sheet"></div>
  <div id="popup"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    /* Safety net: if the app cannot start, show why instead of a blank page. */
    (function () {
      var errs = [];
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT') errs.push('Could not load ' + String(t.src || '').split('/').pop());
        else errs.push((e.message || 'Error') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.artimeFix = function () {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.replace(location.pathname + '?fresh=' + Date.now()); });   // saved entries are not touched
      };
      setTimeout(function () {
        var a = document.getElementById('app');
        if (a && (!a.innerHTML.trim() || a.querySelector('.splash'))) {
          a.innerHTML = '<div style="max-width:520px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;color:#0f172a">' +
            '<h2 style="margin:0 0 8px">ARTIME could not start</h2>' +
            '<p style="color:#475569;margin:0 0 12px">Your saved entries are safe. Tap the button to load the newest app files.</p>' +
            '<p style="background:#fef2f2;color:#b91c1c;padding:10px 12px;border-radius:10px;font-size:14px;word-break:break-word">' + esc(errs.length ? errs.join(' | ') : 'The app did not draw anything.') + '</p>' +
            '<button onclick="artimeFix()" style="background:#1f5fe6;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600;width:100%">Load newest files</button></div>';
        }
      }, 9000);
    })();
  </script>
  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/lang-words.js"></script>
  <script src="js/lang-engine.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/money-link.js"></script>
  <script src="js/home.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/items.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/dial-report.js"></script>
  <script src="js/reorder-list.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/sheet-toast.js"></script>
  <script src="js/events.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/reorder-popups.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
